schema_version: "1.1"
name: No pull request is behind
description: "Spec #24. An implement-tickets run starts while ticket/5-missing-name already contains main; the run checks for behind branches, updates none and goes on to the frontier ticket."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-tickets 0003
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: behind branches checked
    tool: Bash
    # Matched against the Bash input as JSON; anchored to the command, so a description that names git merge-base does not count.
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?git\b(?:[^|;&"\\]|\\"(?:[^"\\]|\\[^"])*\\"|\\[^"])*?\smerge-base\s+--is-ancestor\b'
  - type: tool_used
    name: no update
    tool: Skill
    input_match: 'implement-ticket.*update'
    min: 0
    max: 0
  - type: regex
    name: ticket branch unchanged
    target: { source: file, path: .git/refs/heads/ticket/5-missing-name }
    pattern: '^63ee5efc7e33450f0b18b2381a0c30cb52c267e3$'
    flags: m
  - type: regex
    name: next frontier tickets proposed
    # The step 3 question of implement-tickets: "Implement <#n title, …> in this order, each on its own branch with a pull request?"
    # Any case, the numbers with or without # and zeros, and the tickets listed before the question count; #5 comes before #6.
    pattern: '\bimplement\b[^?]*(?<![\w/])#?0*5\b[^?]*(?<![\w/])#?0*6\b[^?]*\?|(?<![\w/])#?0*5\b[^?]*\bimplement\b[^?]*(?<![\w/])#?0*6\b[^?]*\?|(?<![\w/])#?0*5\b[^?]*(?<![\w/])#?0*6\b[^?]*\bimplement\b[^?]*\?'
    flags: i
