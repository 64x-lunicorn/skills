schema_version: "1.1"
name: No pull request is behind
description: Spec #24. An implement-tickets run starts while ticket/5-greet-missing-name-stranger already contains main; the run checks for behind branches, updates none and goes on to the frontier ticket.
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-tickets 0003
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: behind branches checked
    tool: Bash
    input_match: 'git\s+merge-base\s+--is-ancestor'
  - type: tool_used
    name: no update
    tool: Skill
    input_match: 'implement-ticket.*update'
    min: 0
    max: 0
  - type: regex
    name: ticket branch unchanged
    target: { source: file, path: .git/refs/heads/ticket/5-greet-missing-name-stranger }
    pattern: '^bc50aba86e0cc19a9240ebf287fae0a2daaf148d$'
    flags: m
  - type: regex
    name: next frontier tickets named
    pattern: '#0*5\b[\s\S]*#0*6\b'
