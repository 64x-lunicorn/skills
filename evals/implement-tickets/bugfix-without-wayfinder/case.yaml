schema_version: "1.1"
name: A bugfix runs without a wayfinder
description: "Spec #59. An implement-tickets run for a bugfix issue reads no wayfinder, and its pull request line closes the bugfix issue instead of a Spec."
tags: [scenario]
execution:
  prompt: |
    /64x-lunicorn:implement-tickets 3 — das ist ein Bugfix-Issue, ohne Spec und ohne Wayfinder. Setz es um wie die anderen Tickets auch.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: tool_used
    name: no wayfinder read
    tool: Bash
    input_match: 'gh issue view[^"]*wayfinder'
    min: 0
    max: 0
  - type: llm
    name: no wayfinder asked for
    criteria: >-
      The run treats issue 3 as a bugfix without a Spec or a wayfinder. It does
      not ask for a wayfinder, does not order the ticket by a wayfinder, and
      does not plan a pull request that says Fixes for the bug.
