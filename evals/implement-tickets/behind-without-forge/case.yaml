schema_version: "1.1"
name: Behind without a forge
description: "Spec #24. In a project without a forge or remote, main is not part of the history of ticket/5-missing-name; an implement-tickets run brings that branch up to date."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-tickets 0003
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: updated with implement-ticket update
    tool: Skill
    input_match: 'implement-ticket.*update'
  - type: regex
    name: ticket branch brought up to date
    target: { source: file, path: .git/logs/refs/heads/ticket/5-missing-name }
    pattern: '\t(commit \(merge\)|merge [^:]+: Merge made)'
