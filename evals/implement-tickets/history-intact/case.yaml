schema_version: "1.1"
name: The history the review saw stays intact
description: "Spec #24. An implement-tickets run brings ticket/5-missing-name, pushed at the commit its review saw, up to date with main; the branch keeps that commit, and no push rewrites history. The push itself is not proven: a run that puts a review question to Daniel ends before it, so the case grades the local branch and the force guard, not the push; the GitHub verification run of #38 is the evidence for the push and the gate."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-tickets 0003
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: updated with implement-ticket update
    tool: Skill
    input_match: 'implement-ticket.*update'
  - type: tool_used
    name: pushed without force
    tool: Bash
    # Matched against the Bash input as JSON; anchored to the command, so a description that names a force push does not count.
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?git\b(?:[^|;&"\\]|\\"(?:[^"\\]|\\[^"])*\\"|\\[^"])*?\bpush\b(?:[^|;&"\\]|\\"(?:[^"\\]|\\[^"])*\\"|\\[^"])*?(--force|\s-\w*f\b|\s\+)'
    min: 0
    max: 0
  - type: regex
    name: every commit the review saw still on the branch
    target: { source: file, path: .git/logs/refs/heads/ticket/5-missing-name }
    # The merge commit's first parent is the commit the review saw; a reflog line starts with the old id.
    # A merge committed after --no-commit logs "commit (merge)", a one-step merge logs "merge <ref>: Merge made".
    pattern: '^5c51e27781a2bab8d3705ce4c58cb5bf23352955 [0-9a-f]{40} .*\t(commit \(merge\)|merge [^:]+: Merge made)'
    flags: m
  - type: tool_used
    name: history not rewritten
    tool: Bash
    # Matched against the Bash input as JSON; anchored to the command, so a description that names a rewrite does not count.
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:git\b(?:[^|;&"\\]|\\"(?:[^"\\]|\\[^"])*\\"|\\[^"])*?\b(?:rebase|reset\s+--hard)\b|git\b(?:[^|;&"\\]|\\"(?:[^"\\]|\\[^"])*\\"|\\[^"])*?\bcommit\b(?:[^|;&"\\]|\\"(?:[^"\\]|\\[^"])*\\"|\\[^"])*?--amend)'
    min: 0
    max: 0
