schema_version: "1.1"
name: A behind ticket pull request is updated before a new ticket starts
description: "Spec #24. An implement-tickets run starts while ticket/5-missing-name is behind main and ticket #0006 waits on the frontier; the branch is brought up to date before #0006 starts. The frontier question itself is not proven: a run that puts a review question to Daniel ends before it, and the grader accepts that ending; the GitHub verification run of #38 is the evidence for the push and the gate."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-tickets 0003
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: updated with implement-ticket update
    tool: Skill
    input_match: 'implement-ticket.*update'
  - type: regex
    name: ticket branch brought up to date
    target: { source: file, path: .git/logs/refs/heads/ticket/5-missing-name }
    pattern: '\t(commit \(merge\)|merge [^:]+: Merge made)'
  - type: regex
    name: "frontier ticket proposed after the update, or the run ended on a review question"
    # The step 3 question of implement-tickets; no run can answer it, so the run ends on it, after the update.
    # Any case, the number with or without # and zeros, and the tickets listed before the question count.
    # A run that ends earlier, on a review question to Daniel, counts too: interview-user's two marker lines.
    pattern: '\bimplement\b[^?]*(?<![\w/])#?0*6\b[^?]*\?|(?<![\w/])#?0*6\b[^?]*\bimplement\b[^?]*\?|^Open decisions: \d+$[\s\S]*?^Recommended answer: .+$'
    flags: im
  - type: tool_used
    name: "guard: no branch for the frontier ticket"
    tool: Bash
    # Matched against the Bash input as JSON; anchored to the command, so a description that names the branch does not count.
    # A quoted branch name counts; listing branches with --list, -l or -a does not.
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?\bgit\b(?:(?![|;&])(?:[^"\\]|\\.))*?\b(?:checkout|switch|branch)\b(?!\s+(?:--list|-l|-a)\b)(?:(?![|;&])(?:[^"\\]|\\.))*?(?:\s|\\"|'')ticket/0*6\b'
    min: 0
    max: 0
