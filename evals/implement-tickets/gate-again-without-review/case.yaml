schema_version: "1.1"
name: An updated branch passes the gate again without a review
description: "Spec #24. An implement-tickets run brings ticket/5-missing-name up to date with main; the project's checks run on the branch again and no review-change runs. The gate itself is not proven: #38 and verify-spec check it; the GitHub verification run of #38 is the evidence for the push and the gate."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-tickets 0003
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: updated with implement-ticket update
    tool: Skill
    input_match: 'implement-ticket.*update'
  - type: tool_used
    name: no review after the update
    tool: Skill
    input_match: 'review-change'
    min: 0
    max: 0
  - type: regex
    name: "next frontier ticket proposed after the update, or the run ended on a question to Daniel"
    # The step 3 question of implement-tickets; no run can answer it, so the run ends on it, after the update.
    # Any case, the number with or without # and zeros, and the tickets listed before the question count.
    # A run that ends earlier, on a review question to Daniel, counts too: interview-user's two marker lines.
    pattern: '\bimplement\b[^?]*(?<![\w/])#?0*6\b[^?]*\?|(?<![\w/])#?0*6\b[^?]*\bimplement\b[^?]*\?|^Open decisions: \d+$[\s\S]*?^Recommended answer: .+$'
    flags: im
  - type: tool_used
    name: "guard: no branch for the next frontier ticket"
    tool: Bash
    # Matched against the Bash input as JSON; anchored to the command, so a description that names the branch does not count.
    # A quoted branch name counts; listing branches with --list, -l or -a does not.
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?\bgit\b(?:(?![|;&])(?:[^"\\]|\\.))*?\b(?:checkout|switch|branch)\b(?!\s+(?:--list|-l|-a)\b)(?:(?![|;&])(?:[^"\\]|\\.))*?(?:\s|\\"|'')ticket/0*6\b'
    min: 0
    max: 0
