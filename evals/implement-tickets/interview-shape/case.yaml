schema_version: "1.1"
name: Every calling skill interviews the same way (implement-tickets)
description: Spec #16. implement-tickets needs a series of decisions from Daniel on the judgement findings of a completed Spec's verification; each question comes with a recommended answer and the number of open decisions.
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-tickets 3
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: interview-user called
    tool: Skill
    input_match: 'interview-user'
  - type: regex
    name: exactly one open decisions line
    pattern: 'Open decisions:'
    match: count:1
  - type: regex
    name: recommended answer line
    pattern: '^Recommended answer: .+$'
    flags: m
