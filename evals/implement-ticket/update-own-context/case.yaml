schema_version: "1.1"
name: The update runs in the ticket's own context
description: Spec #24. implement-ticket in update mode brings ticket/5-missing-name up to date with main, taking the ticket side's intent from ticket #0005, its Spec or its scenarios.
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-ticket 5 update
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: resolved with resolve-merge
    tool: Skill
    input_match: 'resolve-merge'
  - type: tool_used
    name: ticket side's intent read from its ticket or Spec
    # The issue file paths appear in no prompt, branch name or commit message.
    tool: Read
    input_match: 'issues/000[15]-'
  - type: tool_order
    name: ticket or Spec read before the merge is recorded
    before: { tool: Read, input_match: 'issues/000[15]-' }
    after: { tool: Bash, input_match: 'git\s+(commit|merge\s+--continue)' }
