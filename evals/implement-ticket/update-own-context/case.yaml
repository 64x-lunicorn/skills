schema_version: "1.1"
name: The update runs in the ticket's own context
description: Spec #24. implement-ticket in update mode brings ticket/5-greet-missing-name-stranger up to date with main, taking the ticket side's intent from ticket #0005, its Spec or its scenarios.
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-ticket 5 update
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: resolved with resolve-merge
    tool: Skill
    input_match: 'resolve-merge'
  - type: regex
    name: ticket side's intent from its own ticket
    pattern: '(#0*5|Spec #0*1)\b[\s\S]*stranger|stranger[\s\S]*(#0*5|Spec #0*1)\b'
