schema_version: '1.1'
name: 'A bugfix is implemented red then green'
description: 'Spec #26. Bugfix #0003 has confirmed seams; implementing it writes the scenario test from the issue, sees it fail on today''s code, then fixes src/greet.sh until it passes.'
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-ticket 3
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: 'tool_used'
    name: 'a test is written'
    tool: 'Write'
    input_match: 'tests/'
  - type: 'tool_used'
    name: 'the project''s checks run'
    tool: 'Bash'
    input_match: 'check.sh'
  - type: 'llm'
    name: 'red then green'
    criteria: 'The scenario test for bugfix #0003 is shown failing against the original src/greet.sh, then src/greet.sh is fixed (the comma is added back) and the same test passes.'
