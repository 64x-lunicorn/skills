schema_version: '1.1'
name: 'Spec-less task scenarios stay green after the change'
description: 'Spec #26. Task #0001 pins render_price''s output while extracting the hard-coded currency symbol; its scenario, checked after the change, still passes.'
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:implement-ticket 1
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: 'tool_used'
    name: 'the project''s checks run'
    tool: 'Bash'
    input_match: 'check.sh'
  - type: 'llm'
    name: 'the pinning scenario still passes after the change'
    criteria: 'Task #0001''s pinning scenario for render_price (1099 cents rendering as $10.99) still passes after the currency symbol is extracted into a named constant.'
