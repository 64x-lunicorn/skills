schema_version: "1.1"
name: Every calling skill interviews the same way (plan-tickets)
description: "Spec #16. plan-tickets needs a series of decisions from Daniel while agreeing the cut; each question comes with a recommended answer and the number of open decisions."
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:plan-tickets 1
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: interview-user called
    tool: Skill
    input_match: 'interview-user'
  - type: regex
    name: exactly one open decisions line
    pattern: '^Open decisions: \d+$'
    match: count:1
    flags: m
  - type: regex
    name: recommended answer line
    pattern: '^Recommended answer: .+\. \S.*$'
    flags: m
