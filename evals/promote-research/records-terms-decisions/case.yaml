    Claude:
    Draft:

    > [!IMPORTANT]
    > This Spec describes domain behaviour. It is never implemented directly; the work happens only in its sub-issues.

    ## Goal

    csv2json converts a CSV file of any size without running out of memory, and its output stays one JSON array.

    ## Problem

    csv2json reads the whole file into memory, so a 4 GB export crashes it.

    ## Domain flow

    ```mermaid
    flowchart TD
        A["Row read"] --> B["Object written to the array"]
        B --> C{"More rows?"}
        C -->|yes| A
        C -->|no| D["Array closed"]
    ```

    ## Domain rules

    - Every file is converted by streaming; there is no flag to read it whole.
    - The output is one JSON array, byte-identical for files that fit in memory today.

    ## Terms

    - **Streaming**: converting a CSV file row by row, writing each object as soon as its row is parsed, so memory stays flat for any file size.

    ## Decisions

    - **Every file is streamed, with no flag to read it whole.** One code path for every size. Daniel: "streaming for everything, no flag".
    - **The output stays one JSON array.** Consumers that already parse the output keep working. Daniel: "keep the array, I do not want to break the people who already parse our output".

    Rejected:

    - Do nothing: document a size limit; the reported export is a normal size for the users who asked.
    - Newline-delimited JSON: changes the output format for every consumer.

    ## Acceptance criteria

    ```gherkin
    Feature: csv2json converts files of any size

      Scenario: A file larger than memory is converted
        Given a CSV file larger than the available memory
        When it is converted
        Then the output is one JSON array holding every row

      Scenario: Small files keep their output
        Given a CSV file converted before this change
        When it is converted again
        Then the output is byte-identical
    ```

    ## Origin

    Research object `0001-streaming-large-files`, promoted today. Gate answers: "yes, that is the problem", "yes, taken seriously", "accepted, later", "yes, promote".

    Technical notes: None.

    Create `Spec: Streaming large files` in issues/?

    Daniel: yes

    Continue.
