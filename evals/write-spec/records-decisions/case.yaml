schema_version: "1.1"
name: write-spec records the Spec's terms and decisions
description: 'Ticket #32, per-caller check from architecture #27: once the Spec exists, write-spec hands its Terms to write-term and its Decisions to write-adr, so an ignored call shows up. Not a Spec scenario; tagged scenario so npm run scenarios can run it.'
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:write-spec

    Earlier turns of this run, quoted:

    Daniel: members should be able to reserve a book that is lent out, and get it next when it comes back

    Claude:
    Open decisions: 2
    Which word does lendbook use for a member's claim on a book that is lent out?
    Recommended answer: Reservation. It is the word you used and says what the member does.

    Daniel: reservation, and it means the member gets the book next when it is returned

    Claude:
    Open decisions: 1
    Can more than one member reserve the same book?
    Recommended answer: No. One reservation per book keeps the hand-over clear for the organiser.

    Daniel: no, one reservation is enough, no waiting list, the circle is small and someone else can ask again after the return

    Claude:
    Your decisions:
    - Word for the claim: "reservation, and it means the member gets the book next when it is returned"
    - Reservations per book: "no, one reservation is enough, no waiting list, the circle is small and someone else can ask again after the return"
    Do you confirm this list?

    Daniel: yes

    Claude:
    Does this sentence state the problem: members cannot claim a book that is lent out, so whoever asks the organiser first after its return gets it?

    Daniel: yes

    Claude:
    What happens if nothing changes, and is that acceptable?

    Daniel: members keep asking the organiser at every meeting, that is not acceptable

    Claude:
    Nothing is left undecided. Is that right?

    Daniel: nothing open

    Claude:
    Draft:

    > [!IMPORTANT]
    > This Spec describes domain behaviour. It is never implemented directly; the work happens only in its sub-issues.

    ## Goal

    A member can reserve a book that is lent out and gets it next when it is returned.

    ## Problem

    Members cannot claim a book that is lent out, so whoever asks the organiser first after its return gets it.

    ## Domain flow

    ```mermaid
    flowchart TD
        A["A member wants a book that is lent out"] --> B{"Book already reserved?"}
        B -->|no| C["The member reserves the book"]
        B -->|yes| D["No reservation; the member asks again after the return"]
        C --> E["The book is returned"]
        E --> F["The organiser hands it to the member who reserved it"]
    ```

    ## Domain rules

    - A book that is not lent out cannot be reserved.
    - A book has at most one reservation at a time.
    - A returned book with a reservation goes to the member who reserved it.

    ## Terms

    - **Member**: a person registered with the lending circle who may borrow books.
    - **Loan**: one book lent to one member, from hand-over until its return.
    - **Reservation**: a member's claim on a book that is currently lent out; the member gets the book next when it is returned.

    ## Decisions

    - **A book has at most one reservation at a time, with no waiting list.** The circle is small and another member can ask again after the return. Daniel: "no, one reservation is enough, no waiting list, the circle is small and someone else can ask again after the return".

    Rejected:

    - A waiting list per book: an order of members to keep and explain for a circle where a second claim is rare.

    ## Acceptance criteria

    ```gherkin
    Feature: Members reserve books that are lent out

      Scenario: A member reserves a book that is lent out
        Given a book is lent out to one member
        When another member reserves the book
        Then the reservation is recorded for that member

      Scenario: A reserved book cannot be reserved again
        Given a book that is lent out has a reservation
        When a third member tries to reserve the book
        Then no second reservation is recorded

      Scenario: A returned book goes to the member who reserved it
        Given a book with a reservation is lent out
        When the book is returned
        Then the organiser is shown the member who reserved it
    ```

    Technical notes: None.

    Create `Spec: Reservations` in issues/?

    Daniel: yes

    Continue.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: file_exists
    name: Spec created
    path: 'issues/0001-*-spec.md'
  - type: tool_used
    name: write-spec hands the terms to write-term
    tool: Skill
    input_match: 'write-term'
  - type: tool_used
    name: write-spec hands the decisions to write-adr
    tool: Skill
    input_match: 'write-adr'
