schema_version: "1.1"
name: Incompatible intents stop the update
description: Spec #24. Merging main into a ticket branch conflicts in src/greet.sh, where ticket #0005 greets a missing name as stranger and bugfix #0007 on main refuses it; the update stops with incompatible intents, quotes both sources and leaves the decision to Daniel.
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Bring this branch, ticket/5-greet-missing-name-stranger, up to date with main and resolve the merge conflicts. The intent of the ticket side comes from ticket #0005 in issues/, its Spec #0001 and its scenarios.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: resolved with resolve-merge
    tool: Skill
    input_match: 'resolve-merge'
  - type: regex
    name: stops with incompatible intents
    pattern: 'incompatible intents'
    flags: i
  - type: regex
    name: source of main's side quoted, bugfix #0007
    pattern: '#0*7\b'
  - type: regex
    name: source of the ticket side quoted, a missing name greeted as stranger
    pattern: 'stranger'
  - type: regex
    name: merge not recorded
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\t(commit \(merge\)|merge [^:]+: Merge made)'
    match: not_contains
