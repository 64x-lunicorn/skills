schema_version: "1.1"
name: Incompatible intents stop the update
description: "Spec #24. Merging main into a branch that belongs to no ticket has merge conflicts in src/greet.sh, where its own change greets a missing name as stranger and bugfix #0007 on main refuses it; the update stops with incompatible intents, quotes both sources and leaves the decision to Daniel."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Bring this branch up to date with main and resolve the merge conflicts. It belongs to no ticket. Its own change: `greet` no longer leaves a missing name blank, defaulting it to "stranger".
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: resolved with resolve-merge
    tool: Skill
    input_match: 'resolve-merge'
  - type: regex
    name: stops with incompatible intents
    pattern: 'incompatible intents'
    flags: i
  - type: regex
    name: "source of main's side quoted, bugfix #0007"
    # Verbatim from the Goal of issues/0007-refuse-missing-name-bugfix.md; in no prompt, branch name or commit message.
    pattern: 'a greeting for nobody corrupts'
  - type: regex
    name: source of this side quoted, a missing name greeted as stranger
    # This branch belongs to no ticket, so the source is the caller's own prompt text
    # (resolve-merge step 1) or the branch's own commit and test, never a ticket file.
    # Measured over live runs: a rule-following agent paraphrases rather than repeating the
    # prompt verbatim, e.g. "no longer leaves a missing name blank", "a missing name is
    # greeted as stranger" (tests/default-name.test.sh) or "greet a missing name as stranger"
    # (the commit subject) all appear across runs, so the two content words are matched near
    # each other instead of one exact sentence.
    pattern: 'missing name[\s\S]{0,60}(stranger|blank)'
    flags: i
  - type: regex
    name: merge not recorded
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\t(commit \(merge\)|merge [^:]+: Merge made)'
    match: not_contains
  - type: tool_used
    name: merge not aborted
    tool: Bash
    # Matched against the Bash input as JSON; anchored to the command, so a description that names an abort does not count.
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?git\b(?:[^|;&"\\]|\\"(?:[^"\\]|\\[^"])*\\"|\\[^"])*?\smerge\s+--abort\b'
    min: 0
    max: 0
  - type: regex
    name: merge left open for Daniel
    target: { source: file, path: .git/MERGE_HEAD }
    pattern: '^[0-9a-f]{40}$'
    flags: m
