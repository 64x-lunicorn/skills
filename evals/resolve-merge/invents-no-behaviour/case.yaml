schema_version: "1.1"
name: Resolving invents no behaviour
description: "Spec #24. Merging main into a branch that belongs to no ticket has merge conflicts in src/greet.sh; every change in the resolved file comes from this side or from main, nothing else."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Bring this branch up to date with main and resolve the merge conflicts. It belongs to no ticket. Its own change: `greet` no longer leaves a missing name blank, defaulting it to "stranger".
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: resolved with resolve-merge
    tool: Skill
    input_match: 'resolve-merge'
  - type: regex
    name: no merge conflict markers left
    target: { source: file, path: src/greet.sh }
    pattern: '^(<<<<<<<|=======|>>>>>>>)'
    flags: m
    match: not_contains
  - type: llm
    name: only changes of the two sides
    focus: { source: file, path: src/greet.sh }
    criteria: >-
      The file defines one shell function greet whose single printf line prints
      the greeting word from GREETING, defaulting to Hello, then a comma, a
      space and the first argument, defaulting to stranger, then a newline.
      Apart from that, the function adds nothing: no other variables, options,
      conditions, loops, validation, comments or output.
