schema_version: "1.1"
name: The project's checks run before the merge is recorded
description: Spec #24. While main is merged into a ticket branch and its merge conflicts are resolved, the project's ci.command runs before the merge commit is made.
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Bring this branch, ticket/5-greet-missing-name-stranger, up to date with main and resolve the merge conflicts. The intent of the ticket side comes from ticket #0005 in issues/, its Spec #0001 and its scenarios.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: resolved with resolve-merge
    tool: Skill
    input_match: 'resolve-merge'
  - type: tool_used
    name: merge recorded
    tool: Bash
    input_match: 'git\s+(commit|merge\s+--continue)'
  - type: tool_order
    name: checks run before the merge is recorded
    before: { tool: Bash, input_match: 'scripts/check\.sh' }
    after: { tool: Bash, input_match: 'git\s+(commit|merge\s+--continue)' }
