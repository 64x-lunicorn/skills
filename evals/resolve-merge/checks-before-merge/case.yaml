schema_version: "1.1"
name: The project's checks run before the merge is recorded
description: "Spec #24. While main is merged into a ticket branch and its merge conflicts are resolved, the project's ci.command runs before the merge commit is made."
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Bring this branch, ticket/5-missing-name, up to date with main and resolve the merge conflicts. The intent of the ticket side comes from ticket #0005 in issues/, its Spec #0001 and its scenarios.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - type: tool_used
    name: resolved with resolve-merge
    tool: Skill
    input_match: 'resolve-merge'
  - type: tool_used
    name: merge recorded
    tool: Bash
    # Matched against the Bash input as JSON; anchored to the command, so a description that names a commit does not count.
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?git\b[^|;&"]*\s(?:commit|merge\s+--continue)(?![\w.=-])'
  - type: regex
    name: checks run on the merge before it is recorded
    # scripts/check.sh appends a line here only after every test passed while .git/MERGE_HEAD exists and no
    # file is still unmerged, which is between resolving the merge conflicts and the merge commit; checks that
    # fail, run with merge conflicts left, before the merge or after its commit leave no line.
    target: { source: file, path: .git/64x-merge-checks.log }
    pattern: '^checks passed on the resolved open merge of [0-9a-f]{40}$'
    flags: m
