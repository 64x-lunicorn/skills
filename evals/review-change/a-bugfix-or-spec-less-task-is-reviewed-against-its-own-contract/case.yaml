schema_version: '1.1'
name: 'A bugfix or Spec-less task is reviewed against its own contract'
description: 'Spec #26. ticket/3-fix-greeting-comma implements bugfix #0003; reviewing it checks the change against #0003''s own scenario and seam instead of a Spec and an architecture issue that do not exist.'
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Review the branch ticket/3-fix-greeting-comma against main on the spec axis for bugfix #0003.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through review-change'
    tool: 'Skill'
    input_match: 'review-change'
  - type: 'llm'
    name: 'reviewed against the bugfix''s own scenario and seam'
    criteria: 'The review checks the diff on ticket/3-fix-greeting-comma against bugfix issue #0003''s own scenario (the comma after the greeting word) and its own seam (src/greet.sh), not against a Spec or an architecture issue, since bugfix #0003 has neither.'
