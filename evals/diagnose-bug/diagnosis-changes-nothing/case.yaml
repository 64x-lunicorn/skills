schema_version: '1.1'
name: 'Diagnosis changes nothing'
description: 'Spec #26. Issue #212 is under diagnosis; when the diagnosis ends, no code in the repository has changed.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:diagnose-bug 212
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'diagnose-bug runs'
    tool: 'Skill'
    input_match: 'diagnose-bug'
  - type: 'tool_used'
    name: 'nothing is written or edited'
    tool: 'Write'
    min: 0
    max: 0
  - type: 'tool_used'
    name: 'nothing is edited'
    tool: 'Edit'
    min: 0
    max: 0
  - type: 'regex'
    name: 'the working tree is clean afterwards'
    target: 'files'
    pattern: '^$'
