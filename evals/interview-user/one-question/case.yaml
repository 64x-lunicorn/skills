schema_version: "1.1"
name: One question at a time
description: "Spec #16. An interview with two open decisions asks only one question and waits for the answer before the next one."
tags: [scenario]
execution:
  prompt: |
    /64x-lunicorn:interview-user

    Plan: publish csv2json, a small command line tool that converts CSV files to JSON, as an open source package.

    Open decisions:
    - which license the package gets
    - which name the package is published under
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: exactly one question block
    pattern: 'Open decisions:'
    match: count:1
  - type: llm
    name: no second question
    criteria: >-
      A question to Daniel has a fixed shape of three lines: an
      "Open decisions: <n>" line, the question itself, and a
      "Recommended answer: <answer>. <reason>" line. These three lines together
      are one question; the count, the recommended answer and its reason are
      part of it and are not a second question. The message asks Daniel exactly
      one question in this shape and then stops to wait for his answer. It
      fails when it asks anything else: a second decision, the other open
      decision put to him as something to answer now, or a follow-up question
      to Daniel.
