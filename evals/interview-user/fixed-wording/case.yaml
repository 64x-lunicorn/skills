schema_version: "1.1"
name: A question with fixed wording is asked word for word
description: "Spec #16. When a calling skill fixes the wording of a question as \"Promote 0003-interview to a Spec?\", the interview asks it word for word."
tags: [scenario]
execution:
  prompt: |
    /64x-lunicorn:interview-user

    Calling skill: promote-research, at the last gate for research object 0003-interview. Gates 1 to 3 are answered.
    The calling skill fixes the wording of this question as "Promote 0003-interview to a Spec?".

    Open decision: whether research object 0003-interview is promoted to a Spec.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: question asked word for word
    pattern: 'Promote 0003-interview to a Spec\?'
