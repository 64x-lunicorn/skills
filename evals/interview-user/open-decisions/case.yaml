schema_version: "1.1"
name: A question shows the decisions still open
description: Spec #16. An interview with three open decisions shows that three decisions are open when it asks the next question.
tags: [scenario]
execution:
  prompt: |
    /64x-lunicorn:interview-user

    Plan: publish csv2json, a small command line tool that converts CSV files to JSON, as an open source package.

    Open decisions:
    - which license the package gets
    - which name the package is published under
    - whether the first release is 0.1.0 or 1.0.0
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: three decisions open
    pattern: '^Open decisions: 3$'
    flags: m
