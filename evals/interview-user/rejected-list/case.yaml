schema_version: "1.1"
name: A rejected list reopens the interview
description: Spec #16. When Daniel does not confirm the list of his decisions, the interview asks again about the decision he disagrees with.
tags: [scenario, pending]
execution:
  prompt: |
    /64x-lunicorn:interview-user

    Plan: publish csv2json, a small command line tool that converts CSV files to JSON, as an open source package.

    Open decisions:
    - which license the package gets
    - which name the package is published under

    Earlier turns of this interview, quoted:

    Claude:
    Open decisions: 2
    Which license does the package get?
    Recommended answer: MIT. It is the usual license for small command line tools and puts no obligations on users.

    Daniel: yes, MIT is fine

    Claude:
    Open decisions: 1
    Which name is the package published under?
    Recommended answer: csv2json. It says what the tool does and matches the plan.

    Daniel: use csv-to-json, csv2json is already taken

    Claude:
    Your decisions:
    - License: "yes, MIT is fine"
    - Package name: "use csv-to-json, csv2json is already taken"
    Do you confirm this list?

    Daniel: no, I am not sure about the name anymore, the license is fine

    Continue the interview.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: one decision open again
    pattern: '^Open decisions: 1$'
    flags: m
  - type: llm
    name: asks again about the package name
    criteria: >-
      The message asks Daniel again which name the package is published under.
      It does not ask about the license again and does not end the interview.
