schema_version: "1.1"
name: The interview ends with confirmed decisions
description: Spec #16. When Daniel has answered every open decision, he is shown the list of his decisions in his words, and the interview ends only after he confirms it.
tags: [scenario, pending]
execution:
  prompt: |
    /64x-lunicorn:interview-user

    Plan: publish csv2json, a small command line tool that converts CSV files to JSON, as an open source package.

    Open decisions:
    - which license the package gets
    - which name the package is published under

    Earlier turns of this interview, quoted:

    Claude:
    Open decisions: 2
    Which license does the package get?
    Recommended answer: MIT. It is the usual license for small command line tools and puts no obligations on users.

    Daniel: yes, MIT is fine

    Claude:
    Open decisions: 1
    Which name is the package published under?
    Recommended answer: csv2json. It says what the tool does and matches the plan.

    Daniel: use csv-to-json, csv2json is already taken

    Continue the interview.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: list holds the chosen name
    pattern: 'csv-to-json'
  - type: llm
    name: list in his words awaits confirmation
    criteria: >-
      The message shows Daniel the list of his decisions, the license MIT and
      the package name csv-to-json, each in the wording of his answers. It asks
      him to confirm the list and does not declare the interview finished.
