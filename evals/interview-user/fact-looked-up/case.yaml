schema_version: "1.1"
name: A fact that can be looked up is not asked
description: Spec #16. An open question whose answer is in the repository is looked up, and Daniel is not asked for it.
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:interview-user

    Plan: publish this repository as csv2json, a small command line tool that converts CSV files to JSON, as an open source package.

    Open questions:
    - which minimum Node.js version the project already requires
    - which license the package gets
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: fact looked up in package.json
    tool: Read
    input_match: 'package\.json'
  - type: llm
    name: Daniel not asked for the fact
    criteria: >-
      The message does not ask Daniel which Node.js version the project
      requires. If it mentions the Node.js version, it states it as found in
      the repository (>=24), not as a question.
