schema_version: "1.1"
name: A question carries a recommended answer
description: Spec #16. A skill needs a decision from Daniel; the question comes with a recommended answer and its reason.
tags: [scenario]
execution:
  prompt: |
    /64x-lunicorn:interview-user

    Plan: publish csv2json, a small command line tool that converts CSV files to JSON, as an open source package.

    Open decision: which license the package gets.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: recommended answer with its reason
    pattern: '^Recommended answer: .+\. \S.*$'
    flags: m
