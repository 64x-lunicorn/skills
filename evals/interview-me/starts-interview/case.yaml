schema_version: "1.1"
name: Daniel starts an interview himself
description: Spec #16. Daniel has a plan outside any skill's flow, runs /64x-lunicorn:interview-me and is interviewed about the plan.
tags: [scenario, pending]
execution:
  prompt: |
    /64x-lunicorn:interview-me I want to publish csv2json, a small command line tool that converts CSV files to JSON, as an open source package. The license and the package name are still open.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: question shows open decisions
    pattern: '^Open decisions: \d+$'
    flags: m
  - type: regex
    name: question carries a recommended answer
    pattern: '^Recommended answer: .+\. \S.*$'
    flags: m
  - type: llm
    name: interviewed about the plan
    criteria: >-
      The message asks Daniel a question about his plan to publish csv2json,
      such as its license or its package name.
