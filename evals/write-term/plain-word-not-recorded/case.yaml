schema_version: "1.1"
name: 'A plain word is not recorded'
description: 'Spec #23. A word without a fixed meaning came up during an interview; the prompt asks in plain text for write-term on it, standing in for the caller, and CONTEXT.md stays unchanged.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Use the write-term skill on the word "shelf": it came up during an interview on the plan for reservations in lendbook and has no fixed meaning in this project. Daniel's answer in that interview, quoted:

    Daniel: an email is fine. Until the member picks it up the book stays on the shelf, and by shelf I just mean wherever the organiser happens to keep it, nothing more
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: write-term judges the word
    tool: Skill
    input_match: 'write-term'
  - type: tool_used
    name: nothing written
    tool: Write
    min: 0
    max: 0
  - type: tool_used
    name: nothing edited
    tool: Edit
    min: 0
    max: 0
  - type: regex
    name: shelf not in CONTEXT.md
    target: { source: file, path: CONTEXT.md }
    pattern: 'shelf'
    flags: i
    match: 'not_contains'
