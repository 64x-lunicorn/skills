schema_version: "1.1"
name: 'A term is not recorded without Daniel''s confirmation'
description: 'Spec #23. A word with a fixed meaning came up and Daniel has not confirmed its meaning; the run ends with the question and CONTEXT.md unchanged.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We are in the architecture review of the Spec for reservations in lendbook.

    Earlier turns of this conversation, quoted:

    Daniel: when a book is lent out, a member can put a hold on it, and they get the book next when it comes back

    Continue.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: write-term handles the term
    tool: Skill
    input_match: 'write-term'
  - type: tool_used
    name: nothing written
    tool: Write
    min: 0
    max: 0
  - type: tool_used
    name: nothing edited
    tool: Edit
    min: 0
    max: 0
  - type: regex
    name: term not in CONTEXT.md
    target: { source: file, path: CONTEXT.md }
    pattern: '\*\*Hold\*\*'
    flags: i
    match: 'not_contains'
  - type: regex
    name: line shown for confirmation
    pattern: '\*\*Hold\*\*: '
    flags: i
