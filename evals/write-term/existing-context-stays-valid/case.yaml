schema_version: "1.1"
name: 'An existing CONTEXT.md stays valid'
description: 'Spec #23. A CONTEXT.md generated by write-agent-docs with one line per term and no words to avoid gets a new term; the existing lines stay and the term is one more line.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We are in the architecture review of the Spec for reservations in lendbook.

    Earlier turns of this conversation, quoted:

    Daniel: when a book is lent out, a member can put a reservation on it, and they get the book next when it comes back

    Claude:
    "Reservation" is not in CONTEXT.md yet. Does it mean exactly this in lendbook: a member's claim on a book that is currently lent out, so that the member gets the book next when it is returned?

    Daniel: yes, that is exactly what a reservation is

    Claude:
    Append this line to CONTEXT.md?

    **Reservation**: a member's claim on a book that is currently lent out; the member gets the book next when it is returned.

    Daniel: yes

    Continue.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: term recorded through write-term
    tool: Skill
    input_match: 'write-term'
  - type: regex
    name: existing lines unchanged
    target: { source: file, path: CONTEXT.md }
    pattern: '^# Terms\n\nThe words this project uses with one fixed meaning, one paragraph each\. Code, issues and Specs use the same word; a new term is added here when it gets a fixed meaning\.\n\n\*\*Member\*\*: a person registered with the lending circle who may borrow books\.\n\n\*\*Loan\*\*: one book lent to one member, from hand-over until its return\.\n'
  - type: regex
    name: new term is one more line
    target: { source: file, path: CONTEXT.md }
    pattern: '^\*\*[^*\n]+\*\*: '
    flags: m
    match: 'count:3'
  - type: regex
    name: new term recorded
    target: { source: file, path: CONTEXT.md }
    pattern: '^\*\*Reservation\*\*: [^\n]+$'
    flags: m
