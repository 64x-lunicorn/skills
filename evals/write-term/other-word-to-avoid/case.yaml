schema_version: "1.1"
name: 'Another word that came up is recorded as one to avoid'
description: 'Spec #23. Daniel confirmed the term Reservation after he first called it a booking; the line to record names booking as a word to avoid.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We are in the architecture review of the Spec for reservations in lendbook.

    Earlier turns of this conversation, quoted:

    Daniel: when a book is lent out, a member can make a booking for it, and they get the book next when it comes back

    Claude:
    "Booking" and "reservation" both came up for this. Which word does lendbook use, and does it mean a member's claim on a book that is currently lent out, so that the member gets the book next when it is returned?

    Daniel: reservation, with exactly that meaning. Booking was just my first word for it

    Continue.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: term recorded through write-term
    tool: Skill
    input_match: 'write-term'
  - type: regex
    name: line names booking as a word to avoid
    pattern: '\*\*Reservation\*\*: [^\n]*_Avoid_: [^\n]*booking'
    flags: i
