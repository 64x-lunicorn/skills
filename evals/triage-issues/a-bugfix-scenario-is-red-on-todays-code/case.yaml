schema_version: '1.1'
name: 'A bugfix scenario is red on today''s code'
description: 'Spec #26. Bugfix issue #221 carries a scenario for the missing comma; checked against today''s unfixed src/greet.sh, it fails.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues

    Bugfix issue #221 is written but not yet implemented. Write its scenario as a test under tests/ and check it against today's code: does it fail?
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - type: 'tool_used'
    name: 'a test file is written'
    tool: 'Write'
    input_match: 'tests/'
  - type: 'tool_used'
    name: 'the test is run'
    tool: 'Bash'
    input_match: 'tests/|check.sh'
  - type: 'llm'
    name: 'the scenario fails on today''s code'
    criteria: 'The message reports that the new scenario test for issue #221 fails when run against today''s code, because the greeting is still missing the comma.'
