schema_version: '1.1'
name: 'A rejected or parked research object counts as an earlier rejection'
description: 'Spec #26. Issue #208 asks for the Google Sheets export that research object 0099-google-sheets-export already rejected; triage names it before asking Daniel anything.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues 208
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'llm'
    name: 'the rejected research object is named first'
    criteria: 'Before asking Daniel anything about issue #208, the message names the research object 0099-google-sheets-export as an earlier rejection of the same idea, because its status is rejected.'
