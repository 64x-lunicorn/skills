schema_version: '1.1'
name: 'An earlier rejection is found before Daniel is asked'
description: 'Spec #26. Issue #207 asks for the CSV export that issue #206 already closed as not planned; triage names #206 before asking Daniel anything.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues 207
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'regex'
    name: 'closed not-planned issues are searched'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'reason:\\"not planned\\"'
  - type: 'llm'
    name: 'the earlier rejection is named first'
    criteria: 'Before asking Daniel anything about issue #207, the message names issue #206 as an earlier rejection of the same CSV export request.'
