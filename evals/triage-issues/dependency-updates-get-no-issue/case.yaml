schema_version: '1.1'
name: 'Dependency updates get no issue'
description: 'Spec #26. An automated dependency-update pull request is open; a triage run creates no issue for it.'
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues

    The tracker also has an open pull request from dependabot[bot], "Bump vitest from 5.0.0 to 5.1.0". It is a pull request, not an issue, and never appears in what `gh issue list` returns.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'tool_used'
    name: 'no issue is filed for the dependency bump'
    tool: 'Bash'
    input_match: 'issue create.*([Vv]itest|dependab)'
    min: 0
    max: 0
