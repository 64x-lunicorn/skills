schema_version: '1.1'
name: 'An issue waiting for triage is examined'
description: 'Spec #26. Triage examines issue #201, labelled needs-triage, and reports what it found for it before asking Daniel anything.'
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues 201
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'llm'
    name: 'reports existing behaviour and earlier rejections first'
    criteria: 'The message reports, for issue #201, what triage found: the existing behaviour or context it looked at in the codebase, and that it searched for earlier rejections, before it asks Daniel anything else. The earlier-rejection search counts as reported when the message names an earlier rejection, says it found none, or reports a searched hit with its reason marked as not the same request (for example `same area only`); it does not have to name a same-area hit as a rejection of #201.'
