schema_version: '1.1'
name: 'Unlabelled issues wait for triage too'
description: 'Spec #26. Issue #202 has no label at all; a triage run started without naming any issue still picks it up.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'regex'
    name: 'the unlabelled pick-up query runs'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'no:label'
  - type: 'llm'
    name: 'issue 202 is among the issues handled'
    criteria: 'Issue #202 is treated as waiting for triage and is among the issues this run reports on or handles, even though it carries no label.'
