schema_version: '1.1'
name: 'A duplicate is closed with a link'
description: 'Spec #26. Issue #211 duplicates the already-open issue #210; triage closes #211 as a duplicate with a comment linking #210.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues 211
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'regex'
    name: 'closed as a duplicate of 210'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'issue close 211 --reason duplicate --duplicate-of 210'
  - type: 'regex'
    name: 'a comment links the existing issue'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'issue comment 211'
