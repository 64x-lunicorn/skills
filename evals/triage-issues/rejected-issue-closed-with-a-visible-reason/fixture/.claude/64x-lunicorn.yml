setup_version: 3
forge: github
default_branch: main
research:
  path: research/
  tracked: false  # false = gitignored, local only
issues:
  tracker: forge
  path: null
ci:
  command: "true"
  runtime: { stack: node, node: ">=24" }
  runner: null
  checks:
    - { name: Tests, run: "true", required: true }
