schema_version: '1.1'
name: 'A rejected issue is closed with a visible reason'
description: 'Spec #26. Daniel rejects issue #209; triage closes it with the tracker''s own reason and a comment explaining why.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues 209

    When triage asks whether to pursue this, answer: reject it, a footer link half a shade off-brand is not worth the churn.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'regex'
    name: 'closed not planned'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'issue close 209 --reason "not planned"'
  - type: 'llm'
    name: 'a comment gives the reason'
    criteria: 'The comment this run posts on issue #209 gives Daniel''s reason for rejecting it: the footer link colour is off-brand but not worth the churn to fix.'
