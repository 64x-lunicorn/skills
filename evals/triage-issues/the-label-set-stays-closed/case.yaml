schema_version: '1.1'
name: 'The label set stays closed'
description: 'Spec #26. After triage handles issue #201, the label set is exactly what it was: no label outside the closed set exists.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues 201

    When triage asks what kind of change this is, answer: broken behaviour, reproducible by clicking Export with nothing selected.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'tool_used'
    name: 'no label is created'
    tool: 'Bash'
    input_match: 'label create'
    min: 0
    max: 0
