schema_version: '1.1'
name: 'Missing information is asked from the reporter'
description: 'Spec #26. Issue #205 cannot be routed without more detail from its reporter; triage asks for it and marks the issue needs-info.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues 205
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'llm'
    name: 'a question is posted as a comment'
    criteria: 'The comment this run posts on issue #205 asks the reporter a specific question about what is missing to route the issue (for example reproduction steps, or when the import failure happens), not just an acknowledgement.'
  - type: 'regex'
    name: 'the issue is labelled needs-info'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'issue edit 205 --add-label needs-info'
