schema_version: '1.1'
name: 'An issue without a reporter reply stays out of triage'
description: 'Spec #26. Issue #204 is needs-info and nobody has commented since triage''s own comment on 2026-09-10, so a triage run without named issues leaves it alone.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'llm'
    name: 'issue 204 is left alone'
    criteria: 'Issue #204 is not among the issues this triage run handles or reports on, since nobody has replied to triage''s own comment on it.'
