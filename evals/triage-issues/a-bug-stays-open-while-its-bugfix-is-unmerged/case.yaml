schema_version: '1.1'
name: 'A Bug stays open while its bugfix is unmerged'
description: 'Spec #26. Issue #212 is blocked by bugfix #221, which is still open; a triage run leaves #212 open.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'tool_used'
    name: 'the Bug is not closed'
    tool: 'Bash'
    input_match: 'issue close 212'
    min: 0
    max: 0
