schema_version: '1.1'
name: 'Triage picks up a report without a type label'
description: 'Spec #96, owned by ticket #49 of Spec #26. Report #230 was filed from a session by a reporter without push access, so it carries no type label and no needs-triage label; a triage run started without naming any issue handles it like #229, which is labelled needs-triage.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:triage-issues
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through triage-issues'
    tool: 'Skill'
    input_match: 'triage-issues'
  - type: 'llm'
    name: 'the report without a type label is handled like one needing triage'
    criteria: 'Issue #230, which carries no label, is among the issues this run treats as waiting for triage and reports on or handles, the same way as issue #229, which is labelled needs-triage.'
