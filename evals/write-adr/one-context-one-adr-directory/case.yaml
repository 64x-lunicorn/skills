schema_version: "1.1"
name: 'One CONTEXT.md and one ADR directory per project'
description: 'Spec #23. A term and an ADR are recorded during the review of code under app/; the term goes to the root CONTEXT.md and the ADR to the single docs/adr/.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We are in the architecture review of the Spec for loan history in lendbook, whose code lives in app/.

    Earlier turns of this conversation, quoted:

    Daniel: every hand-over, return and reservation becomes a loan event in the history

    Claude:
    "Loan event" is not in CONTEXT.md yet. Append this line to CONTEXT.md?

    **Loan event**: one hand-over, return or reservation of a book, stored once and never changed.

    Daniel: yes

    Claude:
    Decision to settle: how is the loan history stored?
    Option A: keep updating the loans table in place and add a history table filled by database triggers.
    Option B: store every hand-over, return and reservation as an event in an append-only table, and derive the current loans from the events.
    Option B keeps the complete history the organiser asked for, but every query for current loans reads through the events, and going back to plain rows later means migrating every recorded event. Option A is simpler, but triggers miss changes made outside the application.

    Daniel: B. The history has to be complete, even if it costs us the simple table.

    Claude:
    This decision is hard to reverse, surprising without context and the result of a real trade-off. Write ADR 0003 Loan history as append-only events?

    Daniel: ok

    Continue.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: term recorded through write-term
    tool: Skill
    input_match: 'write-term'
  - type: tool_used
    name: ADR written through write-adr
    tool: Skill
    input_match: 'write-adr'
  - type: regex
    name: term in the root CONTEXT.md
    target: { source: file, path: CONTEXT.md }
    pattern: '^\*\*Loan event\*\*: '
    flags: m
  - type: file_exists
    name: ADR in docs/adr/
    path: 'docs/adr/0003-*.md'
  - type: regex
    name: no other Markdown file created
    target: files
    pattern: '^(?!docs/adr/0003-)[^\n]*\.md$'
    flags: m
    match: 'not_contains'
