schema_version: "1.1"
name: 'A Spec''s missing terms are reported at verification'
description: 'Spec #23. Spec #0001''s tickets are all closed and its term Reservation is missing from CONTEXT.md; verification reports the missing term and changes nothing.'
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Every ticket of Spec #0001, Reservations, is closed and checked off in wayfinder #0003. Verify the Spec as a whole before we close it. Show verify-spec's result exactly as it returned it, unchanged.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: verified through verify-spec
    tool: Skill
    input_match: 'verify-spec'
  - type: regex
    name: terms checked against CONTEXT.md
    pattern: '^Terms:[^\n]*CONTEXT\.md'
    flags: m
  - type: regex
    name: missing term reported as a hard finding
    pattern: '(?=[^\n]*\bhard\b)(?=[^\n]*\bReservation\b)(?=[^\n]*CONTEXT\.md)'
    flags: i
  - type: tool_used
    name: nothing written
    tool: Write
    min: 0
    max: 0
  - type: tool_used
    name: nothing edited
    tool: Edit
    min: 0
    max: 0
