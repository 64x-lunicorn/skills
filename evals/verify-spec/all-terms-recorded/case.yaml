schema_version: "1.1"
name: 'A Spec with all terms recorded closes without findings on terms'
description: 'Spec #23. Spec #0001''s tickets are all closed and every term of its Terms section is in CONTEXT.md; verification checks the terms and reports no finding on them.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Every ticket of Spec #0001, Reservations, is closed and checked off in wayfinder #0003. Verify the Spec as a whole before we close it. Show verify-spec's result exactly as it returned it, unchanged.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: verified through verify-spec
    tool: Skill
    input_match: 'verify-spec'
  - type: regex
    name: terms checked against CONTEXT.md
    pattern: '^Terms:[^\n]*CONTEXT\.md'
    flags: m
  - type: regex
    name: no finding on terms
    pattern: '^(?!Terms:)(?=[^\n]*\bhard\b)(?=[^\n]*\b(?:Member|Loan|Reservation)\b)(?=[^\n]*CONTEXT\.md)'
    flags: im
    match: 'not_contains'
