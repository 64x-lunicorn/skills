schema_version: "1.1"
name: Candidates speak the project's terms and the design vocabulary
description: "Spec #33. CONTEXT.md defines Pricing for the billing area; a candidate there names the area Pricing and describes the weakness as module, interface, depth, seam or adapter, not as component, service, API or boundary."
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:plan-refactors billing
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
graders:
  - type: tool_used
    name: plan-refactors invoked
    tool: Skill
    input_match: 'plan-refactors'
  - type: regex
    name: area named by its CONTEXT.md term
    target: trace
    pattern: '\bPricing\b'
  - type: llm
    name: weakness described in the design vocabulary
    criteria: >-
      The candidate describes its weakness using the design vocabulary
      (module, interface, depth, seam or adapter), not as a component,
      service, API or boundary.
