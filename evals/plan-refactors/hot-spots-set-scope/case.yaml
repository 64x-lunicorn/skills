schema_version: "1.1"
name: Without an area the hot spots set the scope
description: "Spec #33. Daniel starts a scan without naming an area; the candidates come from src/billing and src/reports, the two places that changed most in the project's git history."
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:plan-refactors
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
graders:
  - type: tool_used
    name: plan-refactors invoked
    tool: Skill
    input_match: 'plan-refactors'
  - type: tool_used
    name: recent history examined
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?git\b(?:[^|;&"\\]|\\"(?:[^"\\]|\\[^"])*\\"|\\[^"])*?\blog\b'
  - type: llm
    name: candidates come from the hot spots
    criteria: >-
      Every refactor candidate the message presents names a file under
      src/billing or src/reports, the two directories with by far the most
      commits in the project's git history. No candidate names a file under
      src/commands or elsewhere that changed only a handful of times.
