schema_version: "1.1"
name: Alternative interfaces are offered and declined
description: "Spec #33. During the interview on the discount-handling candidate, Daniel is asked whether to draft alternative interfaces and says no; none are drafted."
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:plan-refactors billing

    Earlier turns of this run, quoted:

    Claude:
    Refactor scan report: /tmp/refactor-scan-20260910-101500.html

    1. Deepen discount handling in src/billing/apply_discount.sh (Pricing) — strength: strong.
    Files: src/billing/apply_discount.sh.
    Problem: the discount-code branching, the minimum order value and the no-stacking rule sit behind a three-line function that looks trivial, so callers assume it is safe to duplicate.
    Solution: give it a proper interface (discount code, order total, already-applied codes) and document its rules where they live.
    Benefit: one place to change a discount rule and one place to test it.

    Top recommendation: Deepen discount handling in src/billing/apply_discount.sh, because bugfix #0004 already found a caller that could not observe its state correctly.

    Which candidate should I look at?

    Daniel: the discount handling one

    Claude:
    Open decisions: 3
    What must keep behaving exactly as it does today?
    Recommended answer: the WELCOME10 and FLAT5 rules and the minimum-order-value checks, unchanged.

    Daniel: yes, exactly that

    Claude:
    Open decisions: 2
    Where should the seam sit: one function callers call, the same shape as today, or something callers construct?
    Recommended answer: one function, apply_discount(order, code), the same shape callers already use.

    Daniel: keep it a function

    Claude:
    Open decisions: 1
    Should I draft three or more alternative interfaces under different constraints before we settle on one?
    Recommended answer: no, the shape is already narrow enough that one interface is enough here.

    Daniel: no, skip that

    Continue.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
graders:
  - type: tool_used
    name: "guard: no alternative-interface drafting subagents launched"
    tool: Agent
    min: 0
    max: 0
  - type: llm
    name: no alternatives drafted, declined interfaces not compared
    criteria: >-
      The message does not draft or compare any alternative interfaces for
      the discount-handling candidate. It respects Daniel's no and moves on
      (for example to accepting or continuing the interview) without three
      or more interface drafts.
