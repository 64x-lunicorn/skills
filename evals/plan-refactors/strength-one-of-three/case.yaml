schema_version: "1.1"
name: A strength is one of three values
description: "Spec #33. Every candidate a billing scan presents carries a strength of strong, worth exploring or speculative."
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:plan-refactors billing
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
graders:
  - type: tool_used
    name: plan-refactors invoked
    tool: Skill
    input_match: 'plan-refactors'
  - type: regex
    name: strength is one of the three fixed values
    target: trace
    pattern: '^Strength:\s*(strong|worth exploring|speculative)\s*$'
    flags: m
  - type: llm
    name: no other strength wording used
    criteria: >-
      Every candidate's strength is exactly one of three words: strong, worth
      exploring or speculative. No candidate uses a different word or scale
      for its confidence, such as high, medium, low or a percentage.
