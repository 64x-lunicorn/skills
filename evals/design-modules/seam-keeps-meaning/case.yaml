schema_version: "1.1"
name: Seam keeps its meaning
description: "Spec #33. Asked to use the project's design vocabulary on src/billing/apply_discount.sh, the answer's use of Seam matches CONTEXT.md's definition, and depth is explained as a property of the interface (much behaviour behind a small interface), which nothing in this plugin defines yet outside design-modules."
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Using the project's design vocabulary: is src/billing/apply_discount.sh a deep or a shallow module today, where does its seam sit, and does that match what CONTEXT.md says Seam means?
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: design-modules consulted
    tool: Skill
    input_match: 'design-modules'
  - type: llm
    name: seam matches CONTEXT.md, depth explained as a property of the interface
    criteria: >-
      The answer's use of the word seam matches CONTEXT.md's definition (the
      public boundary where behaviour is observed without reaching inside),
      and it explains depth as a property of the interface: a module is
      deep when a lot of behaviour sits behind a small interface, and
      shallow when the interface is nearly as complex as the implementation
      behind it. It does not redefine seam to mean something else, such as
      any internal function boundary.
