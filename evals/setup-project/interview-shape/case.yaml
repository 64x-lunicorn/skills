schema_version: "1.1"
name: Every calling skill interviews the same way (setup-project)
description: Spec #16. setup-project needs a series of decisions from Daniel in its interview; each question comes with a recommended answer and the number of open decisions.
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:setup-project
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - type: tool_used
    name: interview-user called
    tool: Skill
    input_match: 'interview-user'
  - type: regex
    name: exactly one open decisions line
    pattern: '^Open decisions: \d+$'
    match: count:1
    flags: m
  - type: regex
    name: recommended answer line
    pattern: '^Recommended answer: .+\. \S.*$'
    flags: m
