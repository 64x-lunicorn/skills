schema_version: '1.1'
name: 'The interview does not end on a vague answer'
description: 'Spec #96. The reporter describes the bug only as "it does not work"; the interview goes on asking instead of showing a draft.'
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:report-issue

    Earlier turns of this conversation, quoted:

    Claude: Do you want to report a bug or a request?

    Reporter: A bug.

    Claude: What did you do?

    Reporter: I used the plugin.

    Claude: What happened?

    Reporter: it does not work

    Continue.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'llm'
    name: 'the reporter is asked until the bug is reproducible'
    criteria: 'Claude does not show a draft and does not end the interview; it asks the reporter a further question aimed at what someone else would need to reproduce the bug, such as which command or skill they ran and what exactly they saw.'
  - type: 'regex'
    name: 'nothing is filed or commented'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'issue (create|comment)'
    match: 'not_contains'
