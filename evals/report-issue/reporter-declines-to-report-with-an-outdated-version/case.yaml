schema_version: '1.1'
name: 'The reporter declines to report with an outdated version'
description: 'Spec #96. The latest release is v99.0.0; the reporter declines to report anyway, so nothing is filed.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:report-issue

    Earlier turns of this conversation, quoted:

    Claude: You run an older version of 64x-lunicorn than the latest release, v99.0.0. To update, run `claude plugin update 64x-lunicorn` (or `/plugin update`), then `/reload-plugins`. The problem may already be fixed there. Do you want to report anyway?

    Reporter: No, I will update first.

    Continue.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through report-issue'
    tool: 'Skill'
    input_match: 'report-issue'
  - type: 'regex'
    name: 'nothing is filed or commented'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'issue (create|comment)'
    match: 'not_contains'
