schema_version: '1.1'
name: 'The reporter is asked for an unknown version'
description: 'Spec #96. The plugin under test is a fixture plugin whose manifest has no version, so the installed version cannot be determined; starting a report asks the reporter for it.'
tags: [scenario, pending]
plugins: [plugin]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:report-issue

    I want to report a bug.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'tool_used'
    name: 'routed through report-issue'
    tool: 'Skill'
    input_match: 'report-issue'
  - type: 'llm'
    name: 'the reporter is asked for the version'
    criteria: 'Claude asks the reporter which version of the 64x-lunicorn plugin they run, instead of stating a version itself.'
