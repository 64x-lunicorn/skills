schema_version: '1.1'
name: 'An outdated version never blocks a report'
description: 'Spec #96. The latest release is v99.0.0; the reporter chooses to report anyway and confirms the draft; the report is filed and states the installed version, not 99.0.0.'
tags: [scenario, pending]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /64x-lunicorn:report-issue

    Earlier turns of this conversation, quoted:

    Claude: You run an older version of 64x-lunicorn than the latest release, v99.0.0. To update, run `claude plugin update 64x-lunicorn` (or `/plugin update`), then `/reload-plugins`. The problem may already be fixed there. Do you want to report anyway?

    Reporter: Yes, report anyway.

    Claude: Do you want to report a bug or a request?

    Reporter: A bug.

    Claude: What did you do?

    Reporter: I staged two changed files in my shop project and ran /64x-lunicorn:write-commit-message.

    Claude: What happened?

    Reporter: It printed "Commit message:" and then nothing, no message at all. It happens every time, also after restarting Claude Code.

    Claude: What did you expect instead?

    Reporter: A Conventional Commits message for the two staged files.

    Claude: Which operating system do you run Claude Code on?

    Reporter: macOS 15.

    Claude: I found no similar reports in the plugin project.

    Claude:
    Draft of the report for the plugin project 64x-lunicorn/skills:

    Title: write-commit-message prints an empty message for staged changes

    ### What happened

    I staged two changed files in my shop project and ran /64x-lunicorn:write-commit-message. It printed "Commit message:" and then nothing, no message at all. It happens every time, also after restarting Claude Code.

    ### What you expected

    A Conventional Commits message for the two staged files.

    ### Version or environment

    64x-lunicorn at the installed version read at the start of this report; Claude Code on macOS 15.

    File this report?

    Reporter: Yes, file it.

    Continue.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: 'regex'
    name: 'the report is filed'
    target: { source: 'file', path: 'gh-calls.log' }
    pattern: 'issue create.*--repo 64x-lunicorn/skills'
  - type: 'regex'
    name: 'the filed report states a version number'
    target: { source: 'file', path: '.gh/issues.json' }
    pattern: '\b\d+\.\d+\.\d+\b'
  - type: 'regex'
    name: 'the filed report does not state the latest release'
    target: { source: 'file', path: '.gh/issues.json' }
    pattern: '99\.0\.0'
    match: 'not_contains'
