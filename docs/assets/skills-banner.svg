<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">skills - harvested, not invented</title>
  <desc id="desc">A dark warm banner showing repeated corrections flowing into a stack of SKILL.md cards and through a validator check. SKILL.md, validator gate, versioned releases.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14100E"/>
      <stop offset="1" stop-color="#2E1D16"/>
    </linearGradient>
    <linearGradient id="accent" x1="720" y1="80" x2="1110" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2A27E"/>
      <stop offset="1" stop-color="#FFD59E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#B08A76" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#background)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" stroke="#8A6250" stroke-opacity=".35"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="60" y="48" width="222" height="28" rx="14" fill="#D97757" fill-opacity=".14" stroke="#D97757" stroke-opacity=".4"/>
    <circle cx="78" cy="62" r="4" fill="#FFD59E"/>
    <text x="91" y="67" fill="#FFDCCB" font-size="12" font-weight="600" letter-spacing="1.5">CLAUDE CODE PLUGIN</text>
    <text x="57" y="171" fill="#FBF6F2" font-size="88" font-weight="700" letter-spacing="-5">skills<tspan fill="#F2A27E">.</tspan></text>
    <text x="60" y="218" fill="#E6D9D0" font-size="27" font-weight="400">Harvested, not invented.</text>
    <text x="60" y="271" fill="#C4AFA2" font-size="15" letter-spacing=".5">SKILL.MD / VALIDATOR GATE / VERSIONED RELEASES</text>
  </g>

  <!-- repeated corrections flowing into the skill -->
  <g stroke="url(#accent)" stroke-width="2" stroke-linecap="round">
    <path d="M722 128L806 176M712 198H806M722 268L806 220" opacity=".5"/>
    <path d="M936 198H1030" stroke-dasharray="4 8" opacity=".7"/>
    <circle cx="1078" cy="198" r="70" stroke-opacity=".12"/>
    <circle cx="1078" cy="198" r="100" stroke-opacity=".07"/>
  </g>
  <g fill="#F2A27E">
    <circle cx="716" cy="125" r="6"/>
    <circle cx="704" cy="198" r="6" opacity=".85"/>
    <circle cx="716" cy="271" r="6" opacity=".7"/>
  </g>
  <text x="676" y="96" fill="#C4AFA2" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1">3×</text>

  <!-- stack of SKILL.md cards -->
  <g fill="#231813" stroke="#B98468" stroke-width="1.5">
    <rect x="846" y="94" width="96" height="124" rx="14" stroke-opacity=".45"/>
    <rect x="828" y="112" width="96" height="124" rx="14" stroke-opacity=".7"/>
    <rect x="810" y="130" width="120" height="140" rx="16"/>
  </g>
  <text x="828" y="160" fill="#FFDCCB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">SKILL.md</text>
  <g stroke="#E8BFA8" stroke-width="4" stroke-linecap="round">
    <path d="M828 184H872M828 204H906M828 224H890M828 244H862"/>
  </g>

  <!-- validator gate -->
  <circle cx="1078" cy="198" r="40" fill="#231813" stroke="url(#accent)" stroke-width="2"/>
  <path d="M1060 199L1073 212L1097 186" stroke="#FFD59E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="930" cy="130" r="8" fill="#FFD59E"/>
  <circle cx="1140" cy="120" r="4" fill="#F2A27E" opacity=".6"/>
  <circle cx="1030" cy="290" r="4" fill="#FFD59E" opacity=".6"/>
</svg>
